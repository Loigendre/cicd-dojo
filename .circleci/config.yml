version: 2.1

# Image Docker commune aux jobs : même version de Node qu'en local
executors:
  node:
    docker:
      - image: cimg/node:24.15.0

jobs:
  # Installe les dépendances une seule fois et les transmet aux autres jobs
  install:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            - v2-npm-{{ checksum "package-lock.json" }}
      # npm ci : installe exactement ce qui est dans package-lock.json
      - run: npm ci
      - save_cache:
          key: v2-npm-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - persist_to_workspace:
          root: .
          paths:
            - .

  test:
    executor: node
    steps:
      - attach_workspace:
          at: .
      # CircleCI définit CI=true : jest lance les tests une fois au lieu du mode watch
      - run: npm test

  build:
    executor: node
    steps:
      - attach_workspace:
          at: .
      - run: npm run build
      - store_artifacts:
          path: build

  # Audit des dépendances : n'a besoin que de package-lock.json, pas de node_modules
  security:
    executor: node
    steps:
      - checkout
      # npm audit sort en erreur s'il trouve des failles : || true pour ne pas bloquer le pipeline
      - run: npm audit || true
      # Rapport JSON complet téléchargeable dans l'onglet Artifacts du job
      - run: mkdir -p reports && (npm audit --json > reports/npm-audit.json || true)
      - store_artifacts:
          path: reports

workflows:
  # test et build tournent en parallèle, après install ; security en parallèle dès le début
  build-test:
    jobs:
      - install
      - security
      - test:
          requires:
            - install
      - build:
          requires:
            - install

